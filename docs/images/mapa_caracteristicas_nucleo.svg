<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">Mapa visual das características do núcleo celular</title>
  <desc id="description">Ilustração esquemática de um núcleo celular com dez medidas usadas pelo modelo, cada uma identificada por cor e relacionada a uma parte do desenho. À direita, as características estão ordenadas pela posição de sua variante mais importante no gráfico SHAP disponível.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <pattern id="texture" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="2" fill="#64748b" opacity=".55"/>
      <circle cx="16" cy="15" r="3" fill="#64748b" opacity=".35"/>
      <path d="M1 21l8-5M14 4l8-3" stroke="#64748b" stroke-width="1.5" opacity=".45"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #475569; }
      .rank { font-size: 15px; font-weight: 700; }
      .card { fill: #fff; stroke: #d7dee8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#f8fafc"/>
  <text x="60" y="62" class="title">O que cada medida descreve?</text>
  <text x="60" y="96" class="subtitle">São características extraídas da imagem do núcleo de uma célula — não de partes externas da mama.</text>

  <rect x="48" y="128" width="1000" height="1000" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="548" y="178" text-anchor="middle" class="label">Desenho esquemático de um núcleo celular</text>

  <!-- Stylized cell nucleus and a deliberately irregular outline. -->
  <path d="M493 333
           C532 278 592 271 631 296
           C673 266 734 283 754 327
           C806 335 835 378 820 421
           C862 456 862 511 829 542
           C848 592 818 644 770 655
           C756 709 704 738 658 718
           C618 755 560 738 542 694
           C489 704 446 668 450 620
           C401 596 390 540 421 502
           C393 460 409 407 455 390
           C452 365 467 344 493 333 Z"
        fill="#f3e8ff" stroke="#334155" stroke-width="8" stroke-linejoin="round"/>
  <path d="M493 333
           C532 278 592 271 631 296
           C673 266 734 283 754 327
           C806 335 835 378 820 421
           C862 456 862 511 829 542
           C848 592 818 644 770 655
           C756 709 704 738 658 718
           C618 755 560 738 542 694
           C489 704 446 668 450 620
           C401 596 390 540 421 502
           C393 460 409 407 455 390
           C452 365 467 344 493 333 Z"
        fill="url(#texture)" opacity=".8"/>
  <text x="630" y="510" text-anchor="middle" font-size="18" font-weight="700" fill="#475569">região do núcleo</text>
  <text x="630" y="538" text-anchor="middle" class="small">contorno observado na imagem</text>

  <!-- Area: shaded region. -->
  <path d="M520 420 C565 378 650 382 700 424 C742 459 750 526 714 579 C678 632 596 646 535 608 C480 574 470 475 520 420 Z"
        fill="#14b8a6" opacity=".18" stroke="#0f766e" stroke-width="3"/>
  <text x="616" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">área</text>

  <!-- Radius: center point to boundary. -->
  <circle cx="630" cy="510" r="9" fill="#2563eb"/>
  <line x1="630" y1="510" x2="806" y2="393" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="705" y="438" font-size="15" font-weight="700" fill="#1d4ed8">raio</text>

  <!-- Symmetry: axis across an approximate center. -->
  <line x1="629" y1="300" x2="630" y2="718" stroke="#d946ef" stroke-width="4" stroke-dasharray="11 9"/>
  <text x="638" y="324" font-size="14" font-weight="700" fill="#a21caf">eixo de referência</text>

  <!-- Concave areas and points. -->
  <circle cx="829" cy="542" r="11" fill="#f97316" stroke="#fff" stroke-width="3"/>
  <circle cx="542" cy="694" r="11" fill="#f97316" stroke="#fff" stroke-width="3"/>
  <circle cx="421" cy="502" r="11" fill="#f97316" stroke="#fff" stroke-width="3"/>
  <path d="M810 519 Q829 542 851 552" fill="none" stroke="#ea580c" stroke-width="9" stroke-linecap="round"/>
  <text x="825" y="580" font-size="14" font-weight="700" fill="#c2410c">reentrância</text>

  <!-- Perimeter: a highlighted segment of the outline. -->
  <path d="M754 327 C806 335 835 378 820 421" fill="none" stroke="#e11d48" stroke-width="12" stroke-linecap="round"/>

  <!-- Smoothness: compare local outline to a smooth reference curve. -->
  <path d="M440 815 C500 778 566 778 625 815" fill="none" stroke="#7c3aed" stroke-width="5" stroke-dasharray="9 7"/>
  <path d="M440 815 C475 788 489 837 520 812 C550 787 563 838 592 811 C604 800 615 803 625 815"
        fill="none" stroke="#7c3aed" stroke-width="4"/>
  <text x="535" y="849" text-anchor="middle" class="small">suavidade: variações locais do contorno</text>

  <!-- Fractal detail inset. -->
  <rect x="675" y="780" width="145" height="112" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2"/>
  <path d="M688 831l12-17 10 10 12-19 10 15 12-21 10 18 11-13 12 17 10-11 13 18"
        fill="none" stroke="#0f766e" stroke-width="4" stroke-linejoin="round"/>
  <text x="747" y="801" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e">contorno ampliado</text>
  <text x="747" y="876" text-anchor="middle" font-size="11" fill="#475569">complexidade do traçado</text>

  <!-- Callout connectors. -->
  <path d="M370 277 C430 277 471 339 521 363" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M370 381 C441 381 520 421 621 455" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M370 485 C430 485 474 500 513 510" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M370 589 C420 589 443 560 459 544" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M370 693 C424 693 448 671 474 653" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M828 384 C848 384 850 343 858 329" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M828 488 C849 488 850 454 858 438" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M828 592 C849 592 850 563 858 546" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M828 696 C849 696 850 665 858 650" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M820 824 C840 824 850 772 858 754" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Feature labels around the illustration. -->
  <g>
    <rect x="70" y="235" width="300" height="84" rx="13" class="card"/>
    <circle cx="99" cy="268" r="16" fill="#64748b"/><text x="99" y="274" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
    <text x="127" y="267" class="label">Textura</text>
    <text x="91" y="298" class="small">variação dos tons de cinza</text>

    <rect x="70" y="339" width="300" height="84" rx="13" class="card"/>
    <circle cx="99" cy="372" r="16" fill="#d946ef"/><text x="99" y="378" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
    <text x="127" y="371" class="label">Simetria</text>
    <text x="91" y="402" class="small">semelhança dos lados do núcleo</text>

    <rect x="70" y="443" width="300" height="84" rx="13" class="card"/>
    <circle cx="99" cy="476" r="16" fill="#2563eb"/><text x="99" y="482" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">3</text>
    <text x="127" y="475" class="label">Raio</text>
    <text x="91" y="506" class="small">distância centro-contorno</text>

    <rect x="70" y="547" width="300" height="84" rx="13" class="card"/>
    <circle cx="99" cy="580" r="16" fill="#f97316"/><text x="99" y="586" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">4</text>
    <text x="127" y="579" class="label">Concavidade</text>
    <text x="91" y="610" class="small">profundidade das reentrâncias</text>

    <rect x="70" y="651" width="300" height="84" rx="13" class="card"/>
    <circle cx="99" cy="684" r="16" fill="#e11d48"/><text x="99" y="690" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">5</text>
    <text x="127" y="683" class="label">Perímetro</text>
    <text x="91" y="714" class="small">comprimento total do contorno</text>

    <rect x="858" y="283" width="160" height="84" rx="13" class="card"/>
    <circle cx="886" cy="316" r="16" fill="#ea580c"/><text x="886" y="322" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">6</text>
    <text x="913" y="315" font-size="16" font-weight="700">Pontos</text>
    <text x="876" y="346" font-size="13" fill="#475569">locais côncavos</text>

    <rect x="858" y="387" width="160" height="84" rx="13" class="card"/>
    <circle cx="886" cy="420" r="16" fill="#7c3aed"/><text x="886" y="426" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">7</text>
    <text x="913" y="419" font-size="15" font-weight="700">Suavidade</text>
    <text x="876" y="450" font-size="12" fill="#475569">mudanças locais do raio</text>

    <rect x="858" y="491" width="160" height="84" rx="13" class="card"/>
    <circle cx="886" cy="524" r="16" fill="#14b8a6"/><text x="886" y="530" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">8</text>
    <text x="913" y="523" class="label">Área</text>
    <text x="876" y="554" font-size="12" fill="#475569">região dentro do núcleo</text>

    <rect x="858" y="595" width="160" height="84" rx="13" class="card"/>
    <circle cx="886" cy="628" r="16" fill="#ca8a04"/><text x="886" y="634" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">9</text>
    <text x="913" y="627" font-size="14" font-weight="700">Compacidade</text>
    <text x="876" y="658" font-size="12" fill="#475569">relação perímetro / área</text>

    <rect x="858" y="699" width="160" height="84" rx="13" class="card"/>
    <circle cx="886" cy="732" r="16" fill="#0f766e"/><text x="886" y="738" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">10</text>
    <text x="913" y="731" font-size="14" font-weight="700">Dimensão</text>
    <text x="876" y="762" font-size="12" fill="#475569">complexidade do traçado</text>
  </g>

  <text x="70" y="790" font-size="14" font-weight="700" fill="#475569">Nota: é uma representação didática, não uma imagem microscópica real.</text>
  <text x="70" y="815" font-size="13" fill="#64748b">Compactness no conjunto de dados é uma medida derivada; não é uma região anatômica separada.</text>
  <text x="70" y="839" font-size="13" fill="#64748b">Os pontos côncavos marcam exemplos de reentrâncias; não são contagens literais no desenho.</text>
  <text x="70" y="863" font-size="13" fill="#64748b">A textura foi simbolizada por tons e padrões internos; a métrica real é calculada a partir da imagem.</text>

  <!-- Ranked interpretation of the existing global SHAP summary. -->
  <rect x="1080" y="128" width="472" height="1000" rx="22" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1112" y="178" font-size="24" font-weight="700">Ordem de importância</text>
  <text x="1112" y="210" class="small">Referência: gráfico SHAP global deste projeto</text>
  <text x="1112" y="234" class="small">ordem da variante mais bem colocada de cada família</text>

  <g font-size="16">
    <circle cx="1136" cy="285" r="17" fill="#64748b"/><text x="1136" y="291" text-anchor="middle" fill="#fff" font-weight="700">1</text>
    <text x="1168" y="291" font-weight="700">Textura</text><text x="1498" y="291" text-anchor="end" class="small">texture_worst</text>

    <circle cx="1136" cy="344" r="17" fill="#d946ef"/><text x="1136" y="350" text-anchor="middle" fill="#fff" font-weight="700">2</text>
    <text x="1168" y="350" font-weight="700">Simetria</text><text x="1498" y="350" text-anchor="end" class="small">symmetry_worst</text>

    <circle cx="1136" cy="403" r="17" fill="#2563eb"/><text x="1136" y="409" text-anchor="middle" fill="#fff" font-weight="700">3</text>
    <text x="1168" y="409" font-weight="700">Raio</text><text x="1498" y="409" text-anchor="end" class="small">radius_worst</text>

    <circle cx="1136" cy="462" r="17" fill="#f97316"/><text x="1136" y="468" text-anchor="middle" fill="#fff" font-weight="700">4</text>
    <text x="1168" y="468" font-weight="700">Concavidade</text><text x="1498" y="468" text-anchor="end" class="small">concavity_worst</text>

    <circle cx="1136" cy="521" r="17" fill="#e11d48"/><text x="1136" y="527" text-anchor="middle" fill="#fff" font-weight="700">6</text>
    <text x="1168" y="527" font-weight="700">Perímetro</text><text x="1498" y="527" text-anchor="end" class="small">perimeter_worst</text>

    <circle cx="1136" cy="580" r="17" fill="#ea580c"/><text x="1136" y="586" text-anchor="middle" fill="#fff" font-weight="700">7</text>
    <text x="1168" y="586" font-weight="700">Pontos côncavos</text><text x="1498" y="586" text-anchor="end" class="small">concave points_mean</text>

    <circle cx="1136" cy="639" r="17" fill="#7c3aed"/><text x="1136" y="645" text-anchor="middle" fill="#fff" font-weight="700">8</text>
    <text x="1168" y="645" font-weight="700">Suavidade</text><text x="1498" y="645" text-anchor="end" class="small">smoothness_worst</text>

    <circle cx="1136" cy="698" r="17" fill="#14b8a6"/><text x="1136" y="704" text-anchor="middle" fill="#fff" font-weight="700">11</text>
    <text x="1168" y="704" font-weight="700">Área</text><text x="1498" y="704" text-anchor="end" class="small">area_worst</text>

    <circle cx="1136" cy="757" r="17" fill="#ca8a04"/><text x="1136" y="763" text-anchor="middle" fill="#fff" font-weight="700">13</text>
    <text x="1168" y="763" font-weight="700">Compacidade</text><text x="1498" y="763" text-anchor="end" class="small">compactness_se</text>

    <circle cx="1136" cy="816" r="17" fill="#0f766e"/><text x="1136" y="822" text-anchor="middle" fill="#fff" font-weight="700">?</text>
    <text x="1168" y="822" font-weight="700">Dimensão fractal</text><text x="1498" y="822" text-anchor="end" class="small">não aparece individualmente</text>
  </g>
  <line x1="1112" y1="858" x2="1520" y2="858" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1112" y="894" font-size="14" font-weight="700">Como interpretar a ordem</text>
  <text x="1112" y="924" class="small">Os números indicam a posição real dessa variante</text>
  <text x="1112" y="947" class="small">no gráfico, não a soma da família (mean/worst/se).</text>
  <text x="1112" y="970" class="small">A ordem das famílias é, portanto, aproximada.</text>
  <text x="1112" y="1005" class="small">A dimensão fractal está no grupo das 16 variáveis</text>
  <text x="1112" y="1028" class="small">resumidas; sua posição individual não é visível.</text>
  <text x="1112" y="1051" class="small">Importância indica influência no modelo, não causa</text>
  <text x="1112" y="1074" class="small">nem valor de diagnóstico clínico.</text>
</svg>
